name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Codecov upload via OIDC, no token secret
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generated files are up to date
        run: node scripts/generate.mjs --check
      - run: pnpm lint
      - name: Typecheck (with time budget)
        run: timeout 60 pnpm typecheck
      - name: Tests (with coverage thresholds)
        run: pnpm coverage
      - name: Upload coverage
        if: matrix.node == 24
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          use_oidc: true
          files: coverage/lcov.info
          fail_ci_if_error: false
      - run: pnpm build
      - run: pnpm smoke
      - name: Starter example builds and passes its tests
        run: node scripts/check-starter.mjs
