name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Codecov upload via OIDC, no token secret
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generated files are up to date
        run: node scripts/generate.mjs --check
      - run: pnpm lint
      - name: Typecheck (with time budget)
        run: timeout 60 pnpm typecheck
      - name: Tests (with coverage thresholds)
        run: pnpm coverage
      - name: Upload coverage
        if: matrix.node == 24
        uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          files: coverage/lcov.info
          fail_ci_if_error: false
      - run: pnpm build
      - run: pnpm smoke
      - name: Starter example builds and passes its tests
        run: node scripts/check-starter.mjs
