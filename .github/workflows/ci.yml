name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - name: Typecheck (with time budget)
        run: timeout 60 pnpm typecheck
      - run: pnpm test:run
      - run: pnpm build
      - run: pnpm smoke

  min-spec:
    name: oldest supported style spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Keep in sync with the peerDependencies range in package.json.
      - run: pnpm add -D @maplibre/maplibre-gl-style-spec@26.3.0
      - run: pnpm typecheck
      - run: pnpm test:run
        env:
          MIN_SPEC: "1"
